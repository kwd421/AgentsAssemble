<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentsAssemble</title>
    <link rel="stylesheet" href="/shell.css" />
    <script type="module" src="/shell.js"></script>
  </head>
  <body>
    <main class="launcher" aria-labelledby="startup-title">
      <header>
        <div class="mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span><i></i>
        </div>
        <div>
          <p class="eyebrow">AGENTSASSEMBLE DESKTOP</p>
          <h1 id="startup-title">AgentsAssemble을 여는 중</h1>
          <p class="lead">로컬 룸과 저장된 서버 룸을 준비하고 있습니다.</p>
        </div>
      </header>

      <section class="cached-rooms" aria-labelledby="cached-rooms-title">
        <div class="section-heading">
          <h2 id="cached-rooms-title">저장된 룸</h2>
          <span id="cached-room-count">불러오는 중</span>
        </div>
        <div id="cached-room-list" class="cached-room-list" aria-live="polite">
          <p class="cached-room-empty">이 컴퓨터의 룸 기록을 확인하고 있습니다.</p>
        </div>
      </section>

      <section class="startup-progress" aria-describedby="startup-detail">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <strong id="launcher-status" role="status" aria-live="polite">
            로컬 기록을 불러오는 중…
          </strong>
          <p id="startup-detail">처음 실행은 구성 요소 준비에 시간이 조금 걸릴 수 있습니다.</p>
        </div>
        <time id="startup-elapsed" aria-label="경과 시간">0초</time>
      </section>

      <p class="startup-note">
        인터넷 연결이 없어도 이 컴퓨터의 로컬 룸은 열립니다. 저장된 외부 서버 룸은
        클라이언트가 열린 뒤 각 서버의 연결 상태를 표시합니다.
      </p>
      <button id="retry-startup" class="retry hidden" type="button">다시 시도</button>
    </main>
  </body>
</html>
