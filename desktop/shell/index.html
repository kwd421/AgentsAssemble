<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentsAssemble</title>
    <link rel="stylesheet" href="/shell.css" />
    <script type="module" src="/shell.js"></script>
  </head>
  <body>
    <main class="launcher" aria-labelledby="startup-title">
      <header>
        <div class="mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span><i></i>
        </div>
        <div>
          <p class="eyebrow" id="client-platform-label">AGENTSASSEMBLE CLIENT</p>
          <h1 id="startup-title">AgentsAssemble을 여는 중</h1>
          <p class="lead">로컬 룸과 저장된 서버 룸을 준비하고 있습니다.</p>
        </div>
      </header>

      <section class="cached-rooms" aria-labelledby="cached-rooms-title">
        <div class="section-heading">
          <h2 id="cached-rooms-title">저장된 룸</h2>
          <span id="cached-room-count">불러오는 중</span>
        </div>
        <div id="cached-room-list" class="cached-room-list" aria-live="polite">
          <p class="cached-room-empty">이 컴퓨터의 룸 기록을 확인하고 있습니다.</p>
        </div>
      </section>

      <section id="mobile-connect" class="mobile-connect hidden" aria-labelledby="mobile-connect-title">
        <div class="section-heading">
          <h2 id="mobile-connect-title">룸 서버 연결</h2>
          <span>초대·복구 링크 지원</span>
        </div>
        <form id="server-link-form" class="server-link-form">
          <label for="server-link">서버 주소, 초대 링크 또는 복구 링크</label>
          <div>
            <input
              id="server-link"
              type="url"
              inputmode="url"
              autocomplete="url"
              placeholder="https://rooms.example.com/…"
              required
            />
            <button type="submit">열기</button>
          </div>
        </form>
        <button id="scan-room-qr" class="scan-room-qr" type="button">QR 코드 스캔</button>
        <p id="mobile-connect-status" class="mobile-connect-status" role="status" aria-live="polite"></p>
      </section>

      <section class="startup-progress" aria-describedby="startup-detail">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <strong id="launcher-status" role="status" aria-live="polite">
            로컬 기록을 불러오는 중…
          </strong>
          <p id="startup-detail">처음 실행은 구성 요소 준비에 시간이 조금 걸릴 수 있습니다.</p>
        </div>
        <time id="startup-elapsed" aria-label="경과 시간">0초</time>
      </section>

      <p class="startup-note">
        인터넷 연결이 없어도 저장된 룸 목록은 표시됩니다. 연결이 필요한 룸은 서버가
        다시 열리면 같은 항목에서 이어서 들어갈 수 있습니다.
      </p>
      <button id="retry-startup" class="retry hidden" type="button">다시 시도</button>
    </main>
  </body>
</html>
