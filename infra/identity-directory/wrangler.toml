name = "agentsassemble-identity-directory"
main = "src/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "agentsassemble-identity"
database_id = "9f6ce9f8-79cf-47a8-81c7-691ddb48a59b"
migrations_dir = "migrations"

[vars]
SESSION_TTL_SECONDS = "2592000"
MAX_ENDPOINT_LEASE_SECONDS = "900"
ALLOW_TRYCLOUDFLARE_ORIGINS = "false"
CENTRAL_ALLOWED_ORIGINS = "tauri://localhost,http://tauri.localhost,https://tauri.localhost"

# Set these with `wrangler secret put` rather than committing values:
#   RECOVERY_PEPPER
#   IDENTITY_PEPPER
#   GOOGLE_DESKTOP_CLIENT_ID
#   GOOGLE_DESKTOP_CLIENT_SECRET
#   GOOGLE_CLIENT_ID
#   GOOGLE_WEB_CLIENT_SECRET

[triggers]
crons = ["17 3 * * *"]

# Supply the shared Rust frontend build with `wrangler deploy --assets <dist>`.
[assets]
binding = "ASSETS"
run_worker_first = true

# Apply corrected 0010 with cron off, then deploy this release directly.
# Roll back directly to recorded 25fad46a with cleanup disabled; see README.
# Follow README deployment runbook; never increase cron frequency.
# Proposed account-local IDs; account-wide collision check remains unverified.
# Never reuse these for another purpose.

[[ratelimits]]
name = "ABUSE_AUTH_IP"
namespace_id = "260501"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ABUSE_GENERAL_IP"
namespace_id = "260502"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ABUSE_GENERAL_ACTOR"
namespace_id = "260503"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ABUSE_OWNER_GRANT_IP"
namespace_id = "260504"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ABUSE_OWNER_GRANT_ACTOR"
namespace_id = "260505"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "ABUSE_OWNER_REDEEM_IP"
namespace_id = "260506"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ABUSE_OWNER_REDEEM_ACTOR"
namespace_id = "260507"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ABUSE_ENDPOINT_IP"
namespace_id = "260508"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ABUSE_ENDPOINT_ACTOR"
namespace_id = "260509"
simple = { limit = 6, period = 60 }
