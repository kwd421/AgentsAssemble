name = "agentsassemble-identity-directory"
main = "src/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "agentsassemble-identity"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
SESSION_TTL_SECONDS = "2592000"
MAX_ENDPOINT_LEASE_SECONDS = "900"
ALLOW_TRYCLOUDFLARE_ORIGINS = "true"

# Set these with `wrangler secret put` rather than committing values:
#   RECOVERY_PEPPER
#   IDENTITY_PEPPER
#   GOOGLE_CLIENT_ID

[triggers]
crons = ["17 3 * * *"]
