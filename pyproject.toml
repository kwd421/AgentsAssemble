[project]
name = "agentsassemble"
version = "0.1.0"
description = "Local-first multi-agent council orchestrator."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1,<2",
]

[project.scripts]
assemble = "agentsassemble.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentsassemble*"]

[tool.setuptools.package-data]
agentsassemble = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
