[project]
name = "agentsassemble"
version = "0.1.0"
description = "Local-first multi-agent council orchestrator."
requires-python = ">=3.11"
dependencies = [
    "keyring>=25,<26",
    "mcp>=1,<2",
    "pywinpty>=3,<4; platform_system == 'Windows'",
]

[project.optional-dependencies]
postgres = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
assemble = "agentsassemble.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentsassemble*"]
