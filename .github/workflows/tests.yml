name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Install frontend dependencies (for node-based UI tests)
        run: npm --prefix frontend ci
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentsassemble
          POSTGRES_PASSWORD: agentsassemble-test
          POSTGRES_DB: agentsassemble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentsassemble -d agentsassemble_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTSASSEMBLE_TEST_POSTGRES_DSN: postgresql://agentsassemble:agentsassemble-test@127.0.0.1:5432/agentsassemble_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with PostgreSQL support
        run: python -m pip install -e ".[postgres]"
      - name: Run mandatory PostgreSQL contracts
        run: python -m tests.run_postgres_contracts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend (tsc + vite)
        run: npm --prefix frontend run build

  runtime-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Test provider profiles, secret boundaries, and platform transports
        run: python -m unittest tests.test_provider_runtime_controls

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run frontend unit tests
        run: npm --prefix frontend test
      - name: Run canonical room browser test
        run: npm --prefix frontend run test:e2e
