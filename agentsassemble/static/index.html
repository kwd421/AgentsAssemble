<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentsAssemble</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">A</span>
          <div>
            <h1>AgentsAssemble</h1>
            <p id="meeting-subtitle">로컬 council 회의실</p>
          </div>
        </div>
        <div class="actions">
          <select id="meeting-select" aria-label="회의 선택"></select>
          <label class="scale-control">
            <span>UI</span>
            <input id="ui-scale" type="range" min="80" max="115" step="5" value="90" />
          </label>
          <label class="scale-control">
            <span>글자</span>
            <input id="text-scale" type="range" min="80" max="115" step="5" value="90" />
          </label>
          <button id="run-demo" type="button">Mock Demo</button>
        </div>
      </header>

      <nav class="tabs" aria-label="회의 보기" role="tablist">
        <button class="tab is-active" data-tab="lobby" id="tab-lobby" role="tab" aria-controls="lobby" aria-selected="true" type="button">로비</button>
        <button class="tab" data-tab="live" id="tab-live" role="tab" aria-controls="live" aria-selected="false" type="button">실황</button>
        <button class="tab" data-tab="board" id="tab-board" role="tab" aria-controls="board" aria-selected="false" type="button">작전판</button>
        <button class="tab" data-tab="archive" id="tab-archive" role="tab" aria-controls="archive" aria-selected="false" type="button">아카이브</button>
      </nav>

      <section id="empty-state" class="empty">
        <h2>아직 열린 회의가 없습니다.</h2>
        <p>Mock Demo를 실행하면 설정충, 공식이뭘알아, 만갤러가 회의를 시작합니다.</p>
      </section>

      <section id="lobby" class="panel is-active" role="tabpanel" aria-labelledby="tab-lobby"></section>
      <section id="live" class="panel" role="tabpanel" aria-labelledby="tab-live" hidden></section>
      <section id="board" class="panel" role="tabpanel" aria-labelledby="tab-board" hidden></section>
      <section id="archive" class="panel" role="tabpanel" aria-labelledby="tab-archive" hidden></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
