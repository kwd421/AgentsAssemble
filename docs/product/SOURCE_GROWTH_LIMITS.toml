# Existing large files are debt ceilings, not size targets. New responsibilities
# belong behind an owning boundary; small necessary edits have limited headroom.
# Raising a ceiling, or removing one while its file still exists, requires an
# explicit user decision.

[policy]
new_file_line_limit = 800

